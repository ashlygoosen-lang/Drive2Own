      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <style>
        #preload { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0e3b2e; transition: opacity .5s cubic-bezier(.16,1,.3,1), visibility .5s; }
        #preload.gone { opacity: 0; visibility: hidden; }
        #preload .pl { display: flex; flex-direction: column; align-items: center; gap: 18px; opacity: 0; animation: pl-in .6s cubic-bezier(.16,1,.3,1) .15s forwards; }
        #preload .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
        #preload .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#3fbf7f,#ffc72c); animation: pl-bar 1.1s cubic-bezier(.65,0,.35,1) infinite; }
        #preload path.road { stroke-dasharray: 40; stroke-dashoffset: 40; animation: pl-draw 1s cubic-bezier(.16,1,.3,1) .3s forwards; }
        @keyframes pl-in { to { opacity: 1; } }
        @keyframes pl-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
        @keyframes pl-draw { to { stroke-dashoffset: 0; } }
        @media (prefers-reduced-motion: reduce) { #preload .pl { animation: none; opacity: 1; } #preload .bar i { animation: none; width: 100%; } #preload path.road { animation: none; stroke-dashoffset: 0; } }
      </style>

      
    </head>
